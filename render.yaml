services:
  - type: web
    name: rexplain-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free           # change to "starter" if you upgrade
    region: oregon       # pick the region closest to your users

    envVars:
      - key: AZURE_OPENAI_API_KEY
        sync: false         # set this manually in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: rexplain-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false         # optional but strongly recommended (5000 req/hr vs 60)
      - key: HF_API_TOKEN
        sync: false         # required for embedding on Render (no local GPU)
      - key: PORT
        value: "10000"
      - key: GOOGLE_CLIENT_ID
        sync: false         # set in Render dashboard — from Google Cloud Console
      - key: GOOGLE_CLIENT_SECRET
        sync: false         # set in Render dashboard — from Google Cloud Console
      - key: GOOGLE_REDIRECT_URI
        sync: false         # e.g. https://rexplain-api.onrender.com/auth/google/callback
      - key: JWT_SECRET
        sync: false         # generate: python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: FRONTEND_URL
        sync: false         # e.g. https://rexplain.vercel.app

    healthCheckPath: /health

databases:
  - name: rexplain-db
    plan: free
    region: oregon
