                        "shimmer": {

<div class="w-full max-w-sm flex flex-col items-center">
<div class="text-center space-y-6 mb-12">
<div class="flex flex-col items-center gap-8">
<!-- Architectural Loader with Liquid Pulse -->
<div class="relative w-12 h-12 flex items-center justify-center">
<!-- Calm pulsing 'liquid' background -->
<div class="absolute inset-0 bg-stone-200 rounded-full animate-liquid-pulse"></div>
<!-- Outer structural ring -->
<div class="absolute inset-0 border-[0.5px] border-stone-200 rounded-full animate-slow-spin"></div>
<!-- Core indicator -->
<div class="relative w-1.5 h-1.5 bg-stone-950 rounded-full"></div>
</div>
<div class="space-y-2">
<h1 class="font-headline text-xl font-medium tracking-tight text-stone-900 animate-breathing">
                            Analyzing repository
                        </h1>
<p class="font-body text-stone-400 text-[13px] tracking-tight max-w-[240px] mx-auto leading-relaxed opacity-60">
                            Mapping structural architecture and functional logic pathways.
                        </p>
</div>
</div>
</div>

<div class="w-48 h-[1px] bg-stone-100 overflow-hidden relative">
<div class="absolute inset-0 w-1/3 h-full bg-stone-300 animate-shimmer"></div>
</div>

<div class="p-6 bg-white/50 backdrop-blur-sm flex flex-col gap-1.5">

<span class="text-[12px] font-body tabular-nums text-stone-600">REQ-8829-X</span>
</div>
<div class="p-6 bg-white/50 backdrop-blur-sm flex flex-col gap-1.5">
